name: collecte-quotidienne

on:
  schedule:
    - cron: "0 5 * * *"   # chaque jour à 5h UTC
  workflow_dispatch:       # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Collecte
        run: python collecte.py
        env:
          PISTE_CLIENT_ID: ${{ secrets.PISTE_CLIENT_ID }}
          PISTE_CLIENT_SECRET: ${{ secrets.PISTE_CLIENT_SECRET }}

      - name: Publication de data.json
        run: |
          git config user.name "bot-veille"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "Mise à jour quotidienne" || exit 0
          git push
