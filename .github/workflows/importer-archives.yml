name: importer-archives

on:
  workflow_dispatch:       # uniquement lancement manuel
    inputs:
      limite:
        description: "Nombre de fichiers pour un test (ex. 2000). Mettre 0 pour l'import complet."
        required: true
        default: "2000"

permissions:
  contents: write

concurrency:
  group: importer
  cancel-in-progress: false

jobs:
  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: pip install requests

      - name: Lister les archives disponibles chez la DILA
        run: curl -s https://echanges.dila.gouv.fr/OPENDATA/CASS/ | grep -o 'href="[^"]*tar.gz"' | tail -15 || true

      - name: Import des archives DILA
        env:
          LIMITE: ${{ github.event.inputs.limite }}
        run: python importer_dila.py --limite "$LIMITE"

      - name: Construction du moteur de recherche
        run: |
          rm -rf pagefind
          npm install pagefind
          node indexer.mjs

      - name: Publication (data, pagefind)
        run: |
          touch .nojekyll
          git config user.name "bot-veille"
          git config user.email "bot@users.noreply.github.com"
          git add .nojekyll data pagefind
          git commit -m "Import des archives DILA et index de recherche" || exit 0
          git push
